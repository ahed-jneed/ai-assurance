name: Docker image

on:
  pull_request:
    paths:
      - "site-app/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      # Pull requests only build the image; main and version tags publish it.
      - uses: docker/build-push-action@v7
        with:
          context: site-app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The built image must start and offer the first-run setup.
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load -t ai-assurance:ci site-app
          docker run -d --name smoke -p 8787:8787 ai-assurance:ci
          for i in $(seq 1 90); do
            curl -fs -o /dev/null http://127.0.0.1:8787/auth/sign-in && break
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8787/auth/sign-in)" = "http://127.0.0.1:8787/auth/setup"
          docker logs smoke | tail -20
