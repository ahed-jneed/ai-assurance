name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull-request runs of one ref replace each other; every push to main gets a
# group of its own and is never cancelled, so the criteria index history
# (schemas/validate-criteria.mjs, rule 13) is checked for every push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Depth 2: the criteria index check compares with the first parent of
      # the pull request's merge commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r engine/requirements-dev.txt

      # Python 3.12 is the engine's one supported version (engine/README.md,
      # section Packaging); engine/tests/test_packaging.py keeps this file,
      # engine/Dockerfile and engine/requirements.txt in step.
      - name: Python unit tests
        env:
          # The Inspect .eval tests need a zstd back-end; fail instead of skipping.
          GENAI_REQUIRE_ZSTD: "1"
          # The Ed25519 signature tests need cryptography; fail instead of skipping.
          ENGINE_REQUIRE_CRYPTOGRAPHY: "1"
        run: python -m unittest discover -s engine/tests -v

      # The compute image installs the hash-locked engine/requirements-image.txt
      # (cryptography, zstandard); the build fails if either does not import.
      - name: Build the compute image
        run: |
          docker build -t assurance-compute:ci engine
          docker run --rm assurance-compute:ci
          docker run --rm --entrypoint python assurance-compute:ci -I -c "import cryptography, zstandard"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-app/package-lock.json

      # The schema validators load Ajv from site-app/node_modules.
      - name: Install site-app dependencies for the validators
        working-directory: site-app
        run: npm ci --ignore-scripts

      # The rule pack in templates/catalog.json: schema, references, legal-review
      # flags and agreement with the verified research (docs/research).
      - name: Validate the rule pack
        run: node schemas/validate-rule-pack.mjs

      # The Article 50 research the catalogue and the rule pack consume:
      # schema, references, catalogue links and the statistical criteria
      # against the threshold library.
      - name: Validate the Art 50 research
        run: node schemas/validate-art50-research.mjs

      # The criteria documents of templates/criteria: schema, integrity rules
      # and the index history against the base (docs/design/criteria-model.md
      # section 14.2, rule 13). A pull request compares with the base branch
      # tip, a push to main with the tip before the push; a new branch has no
      # base. A base that cannot be read fails the step.
      - name: Validate the criteria documents
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --depth=1 origin "$BEFORE"
            base="$BEFORE"
          else
            base=
          fi
          node schemas/validate-criteria.mjs ${base:+--base "$base"}

      - name: Validate schemas
        run: |
          node schemas/validate-run-schema.mjs
          node schemas/validate-procedure-schema.mjs
          node schemas/validate-working-paper-schema.mjs
          node schemas/validate-dataset-card-schema.mjs
          node schemas/validate-genai-schema.mjs

      # The committed external fixtures carry fixed timestamps; recompute a
      # fresh set with the current engine and validate it as well.
      - name: Validate freshly generated external fixtures
        run: |
          python schemas/generate-external-fixtures.py --output "$RUNNER_TEMP/external-runs.v1.5.json"
          node schemas/validate-run-schema.mjs --external-fixtures-1.5 "$RUNNER_TEMP/external-runs.v1.5.json"

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site-app
    env:
      # Interpreter for the Python-backed assurance harness.
      ASSURANCE_TEST_PYTHON: python
      # Interpreter for scripts/sync-generated.mjs (run schema, runtime zip).
      PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-app/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r ../engine/requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      # The steps below are the parts of `npm run check`, in the same order.
      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Generated copies (lib/*.json, public/tools/*, the run schema) must
      # match their canonical sources; the runtime zip is rebuilt in a temp dir.
      - name: Generated files in sync
        run: npm run check:sync

      # Runs `npm run build` and fails if the output reports a warning.
      - name: Build
        run: npm run check:build

      - name: Check harnesses
        run: npm run check:harnesses

      # Run, procedure and external records and the internal dossier's
      # working papers the harnesses just produced through the API (including
      # dataset-card pins) against the schemas.
      - name: Validate fresh harness fixtures
        run: npm run check:fixtures

  # Persona end-to-end suite with axe checks (site-app/e2e/README.md). It builds
  # the Worker, then runs it in trusted-headers mode on a fresh local D1.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browsers are cached per Playwright version. Without an exact hit,
      # the latest cache of an earlier version is restored and the install
      # below adds only what changed. Only runs on main save the cache:
      # caches saved by pull requests are visible to that pull request only,
      # so they would never be restored elsewhere.
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
          restore-keys: |
            playwright-${{ runner.os }}-

      # The suite runs headless, so the headless shell is enough. The runner
      # image already has Chromium's libraries; `--with-deps` would only add
      # optional font packages, which took ten minutes from the apt mirror.
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium

      - name: Save Playwright browsers
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      # Every flow runs twice on the same database, with no retries: the
      # second run proves a spec does not depend on a fresh database or on
      # what an earlier run left behind (e2e/README.md).
      - name: Persona suite
        run: npm run test:e2e -- --repeat-each=2

      - name: Upload report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            site-app/playwright-report/
            site-app/test-results/
          retention-days: 14
