name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r engine/requirements-dev.txt

      - name: Python unit tests
        run: python -m unittest discover -s engine/tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-app/package-lock.json

      # The schema validators load Ajv from site-app/node_modules.
      - name: Install site-app dependencies for the validators
        working-directory: site-app
        run: npm ci --ignore-scripts

      - name: Validate schemas
        run: |
          node schemas/validate-run-schema.mjs
          node schemas/validate-procedure-schema.mjs

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site-app
    env:
      # Interpreter for the Python-backed assurance harness.
      ASSURANCE_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-app/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r ../engine/requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      # The steps below are the parts of `npm run check`, in the same order.
      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check harnesses
        run: npm run check:harnesses

  # Persona end-to-end suite with axe checks (site-app/e2e/README.md). It builds
  # the Worker, then runs it in trusted-headers mode on a fresh local D1.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Persona suite
        run: npm run test:e2e

      - name: Upload report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            site-app/playwright-report/
            site-app/test-results/
          retention-days: 14
