name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [site-app, engine, schemas, templates / criteria, docs, other]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, inputs and the commit you tested. Do not attach real client data.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node and Python versions, browser if relevant.
